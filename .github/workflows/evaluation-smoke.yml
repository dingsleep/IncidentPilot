name: Evaluation smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluation-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scripted-real-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - name: Bootstrap pinned OpenTelemetry Demo
        shell: pwsh
        run: ./scripts/bootstrap_otel_demo.ps1
      - name: Start real telemetry backends
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DEMO_VERSION = '2.2.0'
          $demo = Join-Path $env:GITHUB_WORKSPACE '.runtime/opentelemetry-demo'
          $overlay = Join-Path $env:GITHUB_WORKSPACE 'infra/otel-demo/docker-compose.incidentpilot.yml'
          Push-Location $demo
          try {
            docker compose -f docker-compose.yml -f $overlay up -d --pull always
            $deadline = (Get-Date).AddMinutes(12)
            do {
              $services = @(docker compose -f docker-compose.yml -f $overlay ps --format json | ConvertFrom-Json)
              $pending = @($services | Where-Object {
                $_.State -ne 'running' -or ($_.Health -and $_.Health -ne 'healthy')
              })
              if ($services.Count -gt 0 -and $pending.Count -eq 0) { exit 0 }
              Start-Sleep -Seconds 5
            } while ((Get-Date) -lt $deadline)
            docker compose -f docker-compose.yml -f $overlay ps
            throw 'OpenTelemetry Demo did not become healthy in time.'
          } finally {
            Pop-Location
          }
      - name: Run scripted Episode against real backends
        run: >-
          python -m pytest
          tests/integration/test_episode_isolation.py::test_runner_orders_real_fault_episode_and_records_reproducibility
          -q
      - name: Stop demo without deleting volumes
        if: always()
        shell: pwsh
        run: |
          $demo = Join-Path $env:GITHUB_WORKSPACE '.runtime/opentelemetry-demo'
          $overlay = Join-Path $env:GITHUB_WORKSPACE 'infra/otel-demo/docker-compose.incidentpilot.yml'
          if (Test-Path $demo) {
            Push-Location $demo
            try { docker compose -f docker-compose.yml -f $overlay stop } finally { Pop-Location }
          }
