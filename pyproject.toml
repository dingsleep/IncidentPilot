[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "incidentpilot"
version = "0.1.0"
description = "Evidence-grounded AIOps incident diagnosis and human-approved remediation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=45,<50",
  "docker>=7,<8",
  "fastapi>=0.138,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "langchain>=1.1,<2",
  "langchain-mcp-adapters>=0.2,<1",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "mcp>=1.28,<2",
  "opentelemetry-api>=1.43,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.43,<2",
  "opentelemetry-instrumentation-fastapi>=0.64b0,<1",
  "opentelemetry-instrumentation-httpx>=0.64b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.64b0,<1",
  "opentelemetry-sdk>=1.43,<2",
  "orjson>=3.10,<4",
  "pgvector>=0.4,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.10,<8",
  "pip-tools>=7.5,<8",
  "playwright>=1.55,<2",
  "pyright>=1.1,<2",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/incidentpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires local infrastructure",
  "e2e: requires the complete application stack",
  "evaluation: runs fault episodes and may call an LLM",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "D:/software/ana/envs"
venv = "tx_agent"
include = ["src", "tests"]
