schema_version: 1
id: ad-failure-001
family: ad-failure
split: train
environment: otel-demo-compose
control_type: fault
alert: {title: Advertisement requests are failing, severity: P3, service_hint: ad, labels: {alertname: AdServiceErrors}}
injections: [{adapter: flagd, operation: enable, service: ad, scenario_key: adFailure, variant: "on", warmup_seconds: 30}]
traffic: {adapter: otel-demo-http, operation: ads, requests: 60}
ground_truth: {root_cause_service: ad, category: application_failure, required_signal_kinds: [metric, trace]}
allowed_actions: [rollback_change]
recovery: {observation_seconds: 30, checks: [{template_id: service_error_ratio, service: ad, comparator: lt, threshold: 0.02}]}
cleanup: [{adapter: flagd, operation: restore_snapshot}]
budgets: {max_duration_seconds: 600, max_read_tool_calls: 24, max_model_tokens: 60000}
