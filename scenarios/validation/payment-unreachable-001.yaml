schema_version: 1
id: payment-unreachable-001
family: payment-unreachable
split: validation
environment: otel-demo-compose
control_type: fault
alert: {title: Checkout error rate is above 5%, severity: P1, service_hint: checkout, labels: {alertname: CheckoutHighErrorRate}}
injections: [{adapter: flagd, operation: enable, service: checkout, scenario_key: paymentUnreachable, variant: "on", warmup_seconds: 30}]
traffic: {adapter: otel-demo-http, operation: checkout, requests: 6}
ground_truth: {root_cause_service: checkout, dependency_service: payment, category: dependency_unreachable, required_signal_kinds: [metric, trace, log]}
allowed_actions: [rollback_change]
recovery: {observation_seconds: 30, checks: [{template_id: service_error_ratio, service: checkout, comparator: lt, threshold: 0.02}]}
cleanup: [{adapter: flagd, operation: restore_snapshot}]
budgets: {max_duration_seconds: 600, max_read_tool_calls: 24, max_model_tokens: 60000}
